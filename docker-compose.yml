services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: smartops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartops
      POSTGRES_PASSWORD: smartops_password
      POSTGRES_DB: smartops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartops"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartops-network

  # NestJS API
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: smartops-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://smartops:smartops_password@postgres:5432/smartops?schema=public&connection_limit=10&pool_timeout=30
      PORT: 4000
      NODE_ENV: production
      FRONTEND_URL: http://web:3000
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your-refresh-secret-key-change-in-production}
      JWT_REFRESH_EXPIRES_IN: 7d
      DB_POOL_MAX: 10
      DB_POOL_IDLE_MS: 30000
      DB_POOL_TIMEOUT_MS: 5000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smartops-network

  # Next.js Web Application
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_APP_URL: http://localhost:3000
    container_name: smartops-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      API_URL: http://api:4000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - smartops-network

networks:
  smartops-network:
    driver: bridge

volumes:
  postgres_data:
